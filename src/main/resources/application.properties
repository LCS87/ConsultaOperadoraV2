# ============================================
# ConsultaOperadoraV2 - Configuracao (Fase 0)
# Precedencia: variavel de ambiente > -Dpropriedade > este arquivo
# ============================================

# Pasta com os CSVs de entrada (substitui o caminho hardcoded E:\\Projetos JAVA\\...)
app.input-folder=./data/export

# Pasta de saida dos arquivos {UF} - {OPERADORA}.csv e do log
app.output-folder=./data/arquivos_finalizados

# Numero de threads no pool de processamento paralelo
app.thread-pool-size=6

# UFs aceitas (padrao: Nordeste)
app.ufs-permitidas=AL,BA,CE,MA,PB,PE,PI,RN,SE
