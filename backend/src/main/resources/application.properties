# ============================================
# Backend API REST (Fase 3 + Fase 4 - Persistencia)
# ============================================
server.port=8080

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# UFs aceitas pelo motor (mesma chave usada pelo CLI - paridade de configuracao)
app.ufs-permitidas=AL,BA,CE,MA,PB,PE,PI,RN,SE

# ---------- Fase 4: JPA / Hibernate / Flyway ----------
# Dev/teste: H2 em arquivo persistente (sobrevive a restart -> dedupe entre execucoes).
# Prod: profile "postgres" abaixo ou env SPRING_DATASOURCE_URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/banco/consultaoperadora;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Schema criado exclusivamente pelo Flyway; Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Console H2 desabilitado por seguranca (habilitar localmente se necessario)
spring.h2.console.enabled=false

# OpenAPI / Swagger UI:
#   spec:  http://localhost:8080/v3/api-docs
#   docs:  http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Profile postgres (producao) ----------
spring.config.activate.on-profile=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/consultaoperadora}
spring.datasource.username=${DB_USER:consulta}
spring.datasource.password=${DB_PASSWORD:consulta}
spring.datasource.driver-class-name=org.postgresql.Driver
